name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Build, Notarize, Release, and Update Tap
    needs: release-please
    if: |
      always() &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}
      VERSION: ${{ needs.release-please.outputs.version || inputs.tag || github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      TAP_REPOSITORY: ${{ secrets.TAP_REPOSITORY }}
      TAP_REPO_PAT: ${{ secrets.TAP_REPO_PAT }}
      TAP_CASK_PATH: ${{ vars.TAP_CASK_PATH || 'Casks/arklike.rb' }}
      TAP_CASK_TOKEN: ${{ vars.TAP_CASK_TOKEN || 'arklike' }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}

      - name: Validate required signing secrets
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build unsigned release app
        id: build
        run: |
          VERSION="${VERSION#v}" Scripts/package-release.sh --build

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Sign, notarize, staple, and validate app
        run: |
          APP_PATH="${{ steps.build.outputs.app_path }}"
          NOTARY_ZIP="$RUNNER_TEMP/Arklike-notary.zip"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning | awk -v team="$APPLE_TEAM_ID" '/Developer ID Application/ && index($0, team) { print $2; exit }')"

          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::Could not find imported Developer ID Application identity for team $APPLE_TEAM_ID"
            security find-identity -v -p codesigning || true
            exit 1
          fi

          codesign \
            --force \
            --deep \
            --timestamp \
            --options runtime \
            --entitlements Arklike/Arklike.entitlements \
            --sign "$SIGNING_IDENTITY" \
            "$APP_PATH"

          codesign --verify --strict --verbose=2 "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"

          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Package signed and notarized app
        id: package
        run: |
          VERSION="${VERSION#v}" APP_PATH="${{ steps.build.outputs.app_path }}" Scripts/package-release.sh --package

      - name: Upload app artifact to GitHub Release
        run: |
          ZIP_PATH="${{ steps.package.outputs.zip_path }}"
          SHA256_PATH="${{ steps.package.outputs.sha256_path }}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP_PATH" "$SHA256_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$ZIP_PATH" "$SHA256_PATH" \
              --title "Arklike ${RELEASE_TAG#v}" \
              --notes "Signed and notarized Arklike ${RELEASE_TAG#v}."
          fi

      - name: Update Homebrew tap cask
        run: |
          if [[ -z "$TAP_REPOSITORY" || -z "$TAP_REPO_PAT" ]]; then
            echo "Skipping tap update because TAP_REPOSITORY or TAP_REPO_PAT is not configured."
            exit 0
          fi

          VERSION="${VERSION#v}" \
          SHA256="${{ steps.package.outputs.sha256 }}" \
          Scripts/update-homebrew-cask.sh
